<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5F4F0" />
  <meta name="description" content="Arenqo. Worth putting our name on." />
  <title>Arenqo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .wordmark { font-family: 'Inter Tight', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#F5F4F0] text-[#181A18] antialiased">
  <div class="mx-auto flex min-h-[100svh] max-w-[1600px] flex-col px-6 sm:px-10 lg:px-16">
    <header class="flex items-center justify-between border-b border-[#DADBD4] py-7 sm:py-9">
      <span class="text-[12px] font-semibold uppercase tracking-[-0.025em]">ARENQO<sup class="ml-0.5 text-[8px]">®</sup></span>
    </header>

    <main class="flex flex-1 flex-col justify-center py-20 sm:py-24">
      <h1 class="wordmark text-[clamp(3.7rem,15vw,14rem)] font-bold leading-[0.83] tracking-[-0.085em]">
        arenqo<span class="text-[#181A18]">.</span>
      </h1>
      <p class="mt-7 text-[14px] font-normal tracking-[-0.015em] text-[#656A64] sm:mt-10 sm:text-[17px]">
        Worth putting our name on.
      </p>
    </main>

    <footer class="border-t border-[#DADBD4] py-7 sm:py-9">
      <p class="text-[11px] tracking-[0.01em] text-[#777B74]">© ARENQO 2026</p>
    </footer>
  </div>
</body>
</html>
